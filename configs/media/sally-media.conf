# sally-media.conf — config for the SallyNet media pipeline (encode + ingest + track log).
# Sourced by the bash scripts (via lib/sally-helpers.sh load_conf) AND read by systemd as
# an EnvironmentFile for the python services. IMPORTANT: keep every comment on its own line
# — systemd EnvironmentFile does NOT strip trailing "# ..." comments, so an inline comment
# becomes part of the value (e.g. a bogus TRACKS_DIR). All values have built-in script
# defaults too, so the encoders also run standalone on a laptop worker with no conf.
#
# Installed to /opt/sally/media/sally-media.conf. Every value is plain-env overridable.
# N100 migration = repoint the *_DIR roots.

# --- storage roots ---
MEDIA_HOME=/mnt/usb/home
INBOX_DIR=/mnt/usb/home/inbox
WORK_DIR=/mnt/usb/home/work
# MEDIA_ROOT is the served library root (/media/<path> maps here).
MEDIA_ROOT=/mnt/usb/home/library
ORIGINALS_DIR=/mnt/usb/home/originals
# SIDECAR_DIR holds the per-item sidecars (source of truth, on the media disk).
SIDECAR_DIR=/mnt/usb/home/catalog/items
# TRACKS_DIR holds the GPS breadcrumb GPX logs. Kept on the Pi's LOCAL disk (SD), not the
# media disk: they're tiny frequent appends best kept on the crash-safe local disk (low
# volume, so SD wear is fine). Geotag correlation reads here too.
TRACKS_DIR=/var/lib/sally/tracks
FAILED_DIR=/mnt/usb/home/failed
LOGS_DIR=/mnt/usb/home/logs
# CATALOG_JSON is the generated read-model — Pi LOCAL disk (crash-safe SD).
CATALOG_JSON=/var/lib/sally/catalog.json

# --- studio library: Movies / TV (Workstream A) ---
# STUDIO_ROOT is a sibling of MEDIA_HOME on the same disk (movies/, tv/ — confirmed live,
# NOT nested under a media/ subfolder). Kept separate from MEDIA_ROOT on purpose.
STUDIO_ROOT=/mnt/usb
MOVIES_JSON=/var/lib/sally/movies.json

# --- encode profile (the "gold standard") ---
# MEDIA_CODEC: h264 (default) or h265 — see api-contract.md.
MEDIA_CODEC=h264
MEDIA_CRF=20
MEDIA_MAXRATE=12M
MEDIA_BUFSIZE=24M
MEDIA_PRESET=slow
MEDIA_MAX_W=1920
MEDIA_MAX_H=1080
MEDIA_AUDIO_KBPS=192
MEDIA_PHOTO_Q=85
MEDIA_THUMB_Q=80
# MEDIA_THREADS bounds ffmpeg so overnight encodes don't starve gpsd/sally-api/RetroPie.
MEDIA_THREADS=2

# --- ingest behaviour ---
# KEEP_ORIGINALS: keep verbatim sources in originals/ for re-encode.
KEEP_ORIGINALS=1
# RECLAIM_MIN: --reclaim returns work/ batches older than this (minutes) to inbox/.
RECLAIM_MIN=30
# GEOTAG_WINDOW_SEC: max gap when correlating capture time to a GPX breadcrumb.
GEOTAG_WINDOW_SEC=120
# MEDIA_LOCAL_UTC_OFFSET: assumed offset for NAIVE capture timestamps (not DST-aware).
MEDIA_LOCAL_UTC_OFFSET=-6

# --- track logger ---
GPSD_HOST=127.0.0.1
GPSD_PORT=2947
TRACK_INTERVAL_S=15
TRACK_MIN_MOVE_M=5

# --- upload server (sally-api) ---
# LAN_BASE_URL: what the QR encodes (guest phones on SallyNet).
LAN_BASE_URL=http://192.168.2.216:8090
# UPLOAD_MAX_BYTES: 8 GiB ceiling for phone video.
UPLOAD_MAX_BYTES=8589934592
